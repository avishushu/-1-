<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נמצא רחפן אבוד</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #f0f2f5; 
            color: #333; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 450px; 
            margin: 40px auto; 
            background: #fff; 
            padding: 40px 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
        }
        h1 { font-size: 26px; color: #1a1a1a; margin-bottom: 15px; }
        p { color: #555; line-height: 1.6; font-size: 16px; margin-bottom: 20px; }
        .reward { font-weight: bold; color: #27ae60; font-size: 18px; }
        
        .btn {
            display: block;
            text-decoration: none;
            color: #fff;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-call { background-color: #007bff; }
        .btn-whatsapp { background-color: #25D366; }
        
        .footer { margin-top: 30px; font-size: 13px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>שלום! מצאת את הרחפן שלי?</h1>
        <p>הרחפן הזה יקר לי מאוד ואשמח לעזרתך בהשבתו. אם מצאת אותו, אודה לך מאוד אם תוכל/י ליצור איתי קשר כדי שנוכל לתאם איסוף.</p>
        
        <p class="reward">פרס כספי מובטח למוצא הישר!</p>
        
        <!-- החלף את המספרים במספר הטלפון האמיתי שלך -->
        <a href="tel:0500000000" class="btn btn-call">📞 התקשר אליי עכשיו</a>
        <a href="https://wa.me/972500000000?text=שלום,%20מצאתי%20את%20הרחפן%20שלך!" class="btn btn-whatsapp">💬 שלח הודעת וואטסאפ</a>
        
        <div class="footer">תודה רבה על העזרה והכנות!</div>
    </div>
</body>
</html>
