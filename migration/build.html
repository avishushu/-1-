<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המערכת בשיפוצים | זמני</title>
    
    <!-- PWA settings for this page -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22App+Maintenance%22%2C%22short_name%22%3A%22Maintenance%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%234F46E5%22%7D">
    <meta name="theme-color" content="#4F46E5">

    <style>
        /* Modern Reset and Fonts */
        :root {
            --primary-color: #4F46E5; /* Indigo */
            --background-color: #F9FAFB; /* Gray 50 */
            --text-color: #1F2937; /* Gray 800 */
            --accent-color: #FBBF24; /* Amber 400 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* Container for the content */
        .container {
            background-color: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Placeholder for Logo - Change the URL in the comment below */
        .logo-space {
            margin-bottom: 40px;
            max-width: 150px;
            max-height: 80px;
        }

        /* Temp SVG Logo Placeholder */
        .logo-placeholder {
            width: 120px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E5E7EB;
            border-radius: 8px;
            color: #9CA3AF;
            font-weight: bold;
            font-size: 14px;
        }

        /* Animated maintenance icon */
        .icon-container {
            margin-bottom: 30px;
            color: var(--primary-color);
            position: relative;
        }

        .icon-main {
            width: 80px;
            height: 80px;
            animation: rotation 3s infinite linear;
        }

        .icon-sparkle {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            color: var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        /* Main title */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        /* Subtitle */
        p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Bottom status badge */
        .status {
            background-color: #EEF2FF;
            color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(20px); }
        }

        @keyframes rotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- === מקום ללוגו המערכת === -->
        <div class="logo-space">
            <!-- כדי להשתמש בלוגו אמיתי: מחק את הdiv הבא, ובטל את הערת ה'img'. -->
            <!-- <img src="path/to/your/logo.png" alt="לוגו המערכת" style="max-width: 100%; height: auto;"> -->
            
            <!-- לוגו Placeholder זמני -->
            <div class="logo-placeholder">לוגו המערכת</div>
        </div>

        <!-- Animated icon -->
        <div class="icon-container">
            <!-- Modern Animated Settings Icon (SVG) -->
            <svg class="icon-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <!-- A small accent sparkle -->
            <svg class="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </div>

        <h1>המערכת זמנית בשיפוצים</h1>
        <p>אנחנו מעדכנים ומשפרים את המערכת כדי להעניק לכם חוויה טובה יותר. נהיה בחזרה בעוד מספר דקות!</p>
        
        <span class="status">סטטוס: תחזוקה שוטפת</span>

    </div>

    <script>
        // Register the minimal PWA Service Worker *specifically* for this maintenance page.
        // This prevents the *original* App Service Worker from messing things up.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('Maintenance Service Worker registered:', registration);
                    
                    // Force the new Service Worker to activate immediately.
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                }).catch(error => {
                    console.log('Maintenance Service Worker registration failed:', error);
                });
            });
        }
    </script>

</body>
</html>
