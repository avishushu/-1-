<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Hodaya Beauty | Native PWA Experience</title>

    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library for Micro-Delight -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#050505',
                            rose: '#be185d',
                            pink: '#fce7f3',
                            glass: 'rgba(255, 255, 255, 0.08)',
                        }
                    },
                    fontFamily: {
                        sans: ['Assistant', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite alternate',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '100%': { transform: 'translate(20px, -30px) scale(1.1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 1. נעילת התנהגות דפדפן ותמיכה ב-Notch */
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body {
            background-color: #050505;
            color: #fdfbfb;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior-y: contain; /* ביטול Pull-to-refresh של הדפדפן */
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            padding-top: var(--sat);
            padding-bottom: calc(80px + var(--sab)); /* רווח עבור סרגל הניווט התחתון */
        }

        /* 2. ספרות יציבות לזמנים ומחירים */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .hero-mask {
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* 3. כותרת דינמית (Smart Header) */
        .smart-header { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .smart-header-inner { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .smart-header.scrolled { padding-top: calc(12px + var(--sat)); padding-left: 20px; padding-right: 20px; }
        .smart-header.scrolled .smart-header-inner {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 9999px;
        }

        /* 4. Bottom Sheet נגרר */
        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 5. Glassmorphism לסרגל ניווט תחתון */
        .glass-nav {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased relative">

    <!-- אורות רקע -->
    <div class="fixed inset-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
        <div class="absolute top-[10%] right-[-10%] w-[250px] h-[250px] bg-pink-700/20 rounded-full mix-blend-screen filter blur-[80px] animate-blob"></div>
        <div class="absolute bottom-[20%] left-[-10%] w-[250px] h-[250px] bg-purple-700/20 rounded-full mix-blend-screen filter blur-[80px]" style="animation-delay: 2s;"></div>
    </div>

    <div class="max-w-md mx-auto relative min-h-screen">
        
        <!-- Smart Floating Header -->
        <div id="headerNav" class="smart-header fixed top-0 w-full max-w-md z-40 p-6">
            <div class="smart-header-inner flex justify-between items-center">
                <span class="font-serif italic font-bold text-xl tracking-wider">Hodaya.</span>
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-white/10 px-3 py-1 rounded-full text-gray-300">שלום, נועה ✨</span>
                </div>
            </div>
        </div>

        <!-- Cinematic Video Hero with Parallax -->
        <header class="relative h-[60vh] w-full hero-mask overflow-hidden">
            <div id="parallaxMedia" class="absolute inset-0 w-full h-[120%] -top-[10%]">
                <video autoplay loop muted playsinline class="w-full h-full object-cover opacity-80">
                    <source src="https://cdn.coverr.co/videos/coverr-a-woman-applying-makeup-5264/1080p.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/20 to-transparent"></div>

            <div class="absolute bottom-16 right-6 left-6 z-10">
                <h1 class="font-serif text-5xl font-bold mb-3 opacity-0 animate-fade-in-up" style="animation-delay: 0.2s;">
                    Hodaya<br><span class="text-brand-rose italic font-light">Beauty</span>
                </h1>
                <p class="text-gray-300 font-light tracking-wide text-lg opacity-0 animate-fade-in-up" style="animation-delay: 0.4s;">
                    אמנות, טיפוח ויוקרה.
                </p>
            </div>
        </header>

        <!-- תוכן מרכזי -->
        <main class="px-6 -mt-10 relative z-20">
            
            <!-- תור קרוב + זמינות בזמן אמת -->
            <div class="space-y-3 mb-6 opacity-0 animate-fade-in-up" style="animation-delay: 0.5s;">
                
                <!-- תור שמור (Personalized Badge) -->
                <div class="bg-gradient-to-r from-pink-950/40 to-purple-950/40 border border-pink-500/20 rounded-2xl p-4 flex justify-between items-center backdrop-blur-md">
                    <div>
                        <span class="text-xs text-pink-300 font-bold uppercase tracking-wider">התור הקרוב שלך</span>
                        <h4 class="font-bold text-white text-sm">מניקור ולק ג'ל</h4>
                    </div>
                    <div class="text-left tabular-nums">
                        <span class="text-sm font-bold text-white block">מחר, 10:00</span>
                        <span class="text-xs text-gray-400">בעוד 22 שעות</span>
                    </div>
                </div>

                <!-- עדכון חי -->
                <div class="inline-flex items-center gap-3 bg-red-950/40 border border-red-500/30 rounded-full px-4 py-2 backdrop-blur-md w-full">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                    </span>
                    <span class="text-sm font-semibold text-red-100 tracking-wide tabular-nums">עדכון חי: נותר תור 1 בלבד להיום!</span>
                </div>
            </div>

            <!-- שירותים -->
            <div class="flex justify-between items-end mb-4 opacity-0 animate-fade-in-up" style="animation-delay: 0.6s;">
                <h2 class="text-2xl font-serif font-bold">השירותים שלנו</h2>
            </div>

            <!-- קרוסלת כרטיסיות -->
            <div class="flex gap-4 overflow-x-auto no-scrollbar pb-6 -mx-6 px-6 snap-x opacity-0 animate-fade-in-up" style="animation-delay: 0.7s;">
                
                <!-- כרטיסייה 1 -->
                <div onclick="openBottomSheet('איפור ערב', '₪350', '60 דק׳')" class="snap-center relative min-w-[220px] h-[280px] rounded-[2.5rem] overflow-hidden flex-shrink-0 group cursor-pointer border border-white/10 active:scale-95 transition-transform">
                    <img src="https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?auto=format&fit=crop&q=80&w=500" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-5">
                        <div class="bg-white/10 backdrop-blur-md w-10 h-10 rounded-2xl flex items-center justify-center mb-3 border border-white/10">
                            <span class="text-xl">💄</span>
                        </div>
                        <h3 class="font-bold text-lg mb-1">איפור ערב</h3>
                        <p class="text-xs text-pink-200 font-bold tabular-nums">₪350 • 60 דק׳</p>
                    </div>
                </div>

                <!-- כרטיסייה 2 -->
                <div onclick="openBottomSheet('מניקור ולק ג׳ל', '₪180', '45 דק׳')" class="snap-center relative min-w-[220px] h-[280px] rounded-[2.5rem] overflow-hidden flex-shrink-0 group cursor-pointer border border-white/10 active:scale-95 transition-transform">
                    <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?auto=format&fit=crop&q=80&w=500" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent"></div>
                    <div class="absolute top-4 right-4 bg-brand-rose/80 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                        <span class="text-xs text-white font-bold">🔥 מבוקש</span>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-5">
                        <div class="bg-white/10 backdrop-blur-md w-10 h-10 rounded-2xl flex items-center justify-center mb-3 border border-white/10">
                            <span class="text-xl">💅</span>
                        </div>
                        <h3 class="font-bold text-lg mb-1">מניקור ולק ג'ל</h3>
                        <p class="text-xs text-pink-200 font-bold tabular-nums">₪180 • 45 דק׳</p>
                    </div>
                </div>

            </div>

        </main>

        <!-- 6. סרגל ניווט תחתון (Native Bottom Navigation Bar) -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto glass-nav pb-[var(--sab)] px-6 py-3">
            <div class="flex justify-between items-center">
                <button class="flex flex-col items-center gap-1 text-brand-rose">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span class="text-[10px] font-bold">ראשי</span>
                </button>
                <button onclick="openBottomSheet('קביעת תור מהירה', '', '')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span class="text-[10px] font-bold">תורים</span>
                </button>
                <a href="https://waze.com" target="_blank" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span class="text-[10px] font-bold">ניווט</span>
                </a>
                <a href="https://wa.me/" target="_blank" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    <span class="text-[10px] font-bold">וואטסאפ</span>
                </a>
            </div>
        </nav>

        <!-- 7. Swipeable Bottom Sheet (מגירת קביעת תור נגררת) -->
        <div id="bottomSheetModal" class="fixed inset-0 z-50 pointer-events-none transition-opacity duration-300 opacity-0 bg-black/60 backdrop-blur-sm">
            <div id="sheetCard" class="bottom-sheet pointer-events-auto absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-[#121212] border-t border-white/10 rounded-t-[2.5rem] p-6 transform translate-y-full pb-[calc(20px+var(--sab))]">
                
                <!-- Drag Handle (ידית גרירה להתנהגות נייטיב) -->
                <div id="dragHandle" class="w-12 h-1.5 bg-gray-600/60 rounded-full mx-auto mb-6 cursor-grab active:cursor-grabbing"></div>

                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 id="sheetTitle" class="text-2xl font-serif font-bold text-white">קביעת תור</h3>
                        <p id="sheetSubtitle" class="text-sm text-gray-400 tabular-nums">בחרי את השעה והתאריך המבוקש</p>
                    </div>
                    <span id="sheetPrice" class="text-xl font-bold text-brand-rose tabular-nums"></span>
                </div>

                <!-- טופס מהיר -->
                <form onsubmit="completeBooking(event)" class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">תאריך מבוקש</label>
                        <input type="date" required class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white focus:outline-none focus:border-brand-rose tabular-nums">
                    </div>
                    
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">שעות זמינות להיום</label>
                        <div class="grid grid-cols-3 gap-2 tabular-nums">
                            <button type="button" onclick="selectTime(this)" class="time-btn bg-white/5 border border-white/10 rounded-xl py-3 text-sm font-semibold hover:bg-brand-rose/20 active:scale-95 transition-all">14:00</button>
                            <button type="button" onclick="selectTime(this)" class="time-btn bg-white/5 border border-white/10 rounded-xl py-3 text-sm font-semibold hover:bg-brand-rose/20 active:scale-95 transition-all">16:30</button>
                            <button type="button" onclick="selectTime(this)" class="time-btn bg-white/5 border border-white/10 rounded-xl py-3 text-sm font-semibold hover:bg-brand-rose/20 active:scale-95 transition-all">18:00</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-brand-rose to-pink-700 text-white rounded-2xl py-4 font-bold text-lg shadow-lg active:scale-95 transition-transform mt-4 flex items-center justify-center gap-2">
                        <span>אישור והבטחת התור</span>
                    </button>
                </form>

            </div>
        </div>

    </div>

    <script>
        // Parallax & Smart Header
        const header = document.getElementById('headerNav');
        const parallaxMedia = document.getElementById('parallaxMedia');

        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;
            if (parallaxMedia) parallaxMedia.style.transform = `translateY(${scrollY * 0.35}px)`;
            if (scrollY > 40) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        // Haptic Feedback Helper
        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(12);
        }

        // Bottom Sheet Logic (Open / Close / Drag)
        const modal = document.getElementById('bottomSheetModal');
        const card = document.getElementById('sheetCard');

        function openBottomSheet(title, price, duration) {
            triggerHaptic();
            document.getElementById('sheetTitle').innerText = title;
            document.getElementById('sheetPrice').innerText = price;
            if(duration) document.getElementById('sheetSubtitle').innerText = `משך הטיפול: ${duration}`;

            modal.classList.remove('pointer-events-none', 'opacity-0');
            card.classList.remove('translate-y-full');
        }

        function closeBottomSheet() {
            triggerHaptic();
            card.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('pointer-events-none'), 300);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeBottomSheet();
        });

        // Select Time Button
        function selectTime(btn) {
            triggerHaptic();
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('border-brand-rose', 'bg-brand-rose/30'));
            btn.classList.add('border-brand-rose', 'bg-brand-rose/30');
        }

        // 8. Micro-Delight Confetti & Booking Completion
        function completeBooking(e) {
            e.preventDefault();
            triggerHaptic();

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<span>שומר תור...</span>`;

            setTimeout(() => {
                // פיזור חלקיקי חגיגה (Confetti)
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.8 },
                    colors: ['#be185d', '#fce7f3', '#ffffff']
                });

                btn.innerHTML = `<span>✓ התור שוריין בהצלחה!</span>`;
                btn.classList.remove('from-brand-rose', 'to-pink-700');
                btn.classList.add('bg-green-600');

                setTimeout(() => {
                    closeBottomSheet();
                    // איפוס כפתור לאחר סגירה
                    setTimeout(() => {
                        btn.innerHTML = `<span>אישור והבטחת התור</span>`;
                        btn.classList.add('from-brand-rose', 'to-pink-700');
                        btn.classList.remove('bg-green-600');
                    }, 400);
                }, 1500);

            }, 600);
        }
    </script>
</body>
</html>
