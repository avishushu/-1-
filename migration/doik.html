<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hodaya Beauty | איפור וציפורניים</title>
    <meta name="theme-color" content="#FAF5F5">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#FAF5F5',
                            pink: '#FCE7F3',
                            rose: '#BE185D',
                            dark: '#1C1917',
                        }
                    },
                    fontFamily: {
                        sans: ['Assistant', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Eruda Mobile Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        body { 
            background-color: #FAF5F5; 
            color: #1C1917; 
            -webkit-tap-highlight-color: transparent; 
        }
        .glass { 
            background: rgba(250, 245, 245, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(190, 24, 93, 0.05); 
        }
        /* Hide scrollbar for horizontal scroll areas */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased pb-28">
    
    <!-- Header -->
    <header class="fixed w-full top-0 glass z-50">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-serif tracking-wide text-brand-dark">Hodaya <span class="text-brand-rose italic text-2xl">Beauty</span></h1>
        </div>
    </header>

    <main class="pt-24 max-w-md mx-auto px-6 space-y-10">
        
        <!-- Hero Section -->
        <div class="relative rounded-3xl overflow-hidden h-80 shadow-2xl">
            <!-- Image placeholder (Makeup/Nails aesthetic) -->
            <img src="https://images.unsplash.com/photo-1512496015851-a1c8dc833504?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="איפור מקצועי" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex flex-col justify-end p-6">
                <p class="text-brand-pink text-xs font-semibold tracking-widest mb-2 uppercase">Makeup & Nails</p>
                <h2 class="text-white text-4xl font-serif leading-tight shadow-sm">היופי שלך,<br>האמנות שלנו.</h2>
            </div>
        </div>

        <!-- Categories / Services -->
        <div>
            <div class="flex justify-between items-end mb-4">
                <h3 class="text-xl font-bold text-brand-dark">ההתמחויות שלנו</h3>
            </div>
            <div class="flex gap-4 overflow-x-auto hide-scrollbar pb-4 -mx-6 px-6">
                
                <div class="min-w-[140px] bg-white rounded-2xl p-5 shadow-sm border border-brand-pink/50 text-center flex-shrink-0">
                    <div class="w-14 h-14 mx-auto bg-brand-pink/40 rounded-full flex items-center justify-center mb-3 text-2xl shadow-inner">💄</div>
                    <h4 class="font-bold text-sm text-brand-dark">איפור ערב וכלה</h4>
                </div>
                
                <div class="min-w-[140px] bg-white rounded-2xl p-5 shadow-sm border border-brand-pink/50 text-center flex-shrink-0">
                    <div class="w-14 h-14 mx-auto bg-brand-pink/40 rounded-full flex items-center justify-center mb-3 text-2xl shadow-inner">💅</div>
                    <h4 class="font-bold text-sm text-brand-dark">מניקור ולק ג'ל</h4>
                </div>
                
                <div class="min-w-[140px] bg-white rounded-2xl p-5 shadow-sm border border-brand-pink/50 text-center flex-shrink-0">
                    <div class="w-14 h-14 mx-auto bg-brand-pink/40 rounded-full flex items-center justify-center mb-3 text-2xl shadow-inner">✨</div>
                    <h4 class="font-bold text-sm text-brand-dark">בניית ציפורניים</h4>
                </div>

            </div>
        </div>

        <!-- Portfolio Snippet -->
        <div>
            <h3 class="text-xl font-bold text-brand-dark mb-4">הצצה לעבודות</h3>
            <div class="grid grid-cols-2 gap-3">
                <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="עבודת איפור" class="rounded-2xl h-44 w-full object-cover shadow-sm">
                <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="עבודת ציפורניים" class="rounded-2xl h-44 w-full object-cover shadow-sm">
            </div>
        </div>

    </main>

    <!-- Floating CTA Button -->
    <div class="fixed bottom-6 left-0 right-0 px-6 z-40 max-w-md mx-auto pointer-events-none">
        <button onclick="toggleModal('bookingModal')" class="pointer-events-auto w-full bg-brand-dark text-white rounded-2xl py-4 font-bold text-lg shadow-2xl hover:bg-black transition transform active:scale-95 flex justify-center items-center gap-3">
            <span>קביעת תור בקליק</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </button>
    </div>

    <!-- Footer -->
    <footer class="mt-8 pb-8 text-center text-sm text-gray-400 max-w-md mx-auto">
        <p>© 2026 Hodaya Beauty.</p>
        <p class="mt-1 text-xs">לתמיכה טכנית: AnfinityRoot@gmail.com</p>
    </footer>

    <!-- Booking Modal (Bottom Sheet) -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 z-[100] hidden flex-col justify-end transition-opacity backdrop-blur-sm">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 transform transition-transform relative max-h-[90vh] overflow-y-auto">
            
            <button onclick="toggleModal('bookingModal')" class="absolute top-5 left-6 text-gray-400 hover:text-gray-800 text-3xl leading-none">&times;</button>
            
            <div class="text-center mb-6 mt-2">
                <h3 class="text-2xl font-serif font-bold text-brand-dark">התור החדש שלך</h3>
                <p class="text-sm text-gray-500 mt-1">נא למלא את הפרטים כדי לשריין מקום</p>
            </div>
            
            <form class="space-y-5" onsubmit="event.preventDefault(); alert('הבקשה נשלחה! ניצור קשר לאישור סופי.'); toggleModal('bookingModal');">
                
                <!-- Service Selection -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">סוג הטיפול</label>
                    <select required class="w-full bg-brand-light border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-brand-rose focus:ring-1 focus:ring-brand-rose transition-all">
                        <option value="">בחירת שירות...</option>
                        <option value="makeup_evening">איפור ערב</option>
                        <option value="makeup_bride">איפור כלה / ליווי כלה</option>
                        <option value="nails_gel">מניקור ולק ג'ל</option>
                        <option value="nails_build">בניית ציפורניים</option>
                        <option value="nails_fill">מילוי ציפורניים</option>
                    </select>
                </div>

                <!-- Name (Required) -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">שם מלא</label>
                    <input type="text" required class="w-full bg-brand-light border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-brand-rose focus:ring-1 focus:ring-brand-rose transition-all" placeholder="השם שלך">
                </div>
                
                <!-- Phone (Optional) -->
                <div>
                    <label class="block text-sm font-bold text-brand-dark mb-2">טלפון <span class="text-gray-400 text-xs font-normal">(אופציונלי)</span></label>
                    <input type="tel" class="w-full bg-brand-light border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-brand-rose focus:ring-1 focus:ring-brand-rose transition-all" placeholder="050-0000000">
                </div>

                <!-- Date & Time Picker -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-2">תאריך</label>
                        <input type="date" required class="w-full bg-brand-light border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-brand-rose focus:ring-1 focus:ring-brand-rose transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-brand-dark mb-2">שעה</label>
                        <input type="time" required class="w-full bg-brand-light border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-brand-rose focus:ring-1 focus:ring-brand-rose transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full bg-brand-rose text-white rounded-xl py-4 mt-8 font-bold text-lg shadow-lg hover:bg-pink-700 transition">
                    אישור וסיום
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Toggle Script -->
    <script>
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
</body>
</html>
