<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hodaya Beauty | Premium Experience</title>
    <meta name="theme-color" content="#FDFBFB">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#FDFBFB',
                            pink: '#FCE7F3',
                            rose: '#9D174D',
                            dark: '#1C1917',
                        }
                    },
                    fontFamily: {
                        sans: ['Assistant', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #FDFBFB; 
            color: #1C1917; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }
        
        /* Advanced Glassmorphism */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(157, 23, 77, 0.05);
        }
        
        .glass-header {
            background: linear-gradient(180deg, rgba(253, 251, 251, 0.95) 0%, rgba(253, 251, 251, 0.7) 100%);
            backdrop-filter: blur(12px);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animation Utility Classes */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased pb-32 relative">
    
    <!-- Animated Background Blobs -->
    <div class="fixed inset-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
        <div class="absolute top-0 right-0 w-72 h-72 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-40 left-10 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-8 right-20 w-72 h-72 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Header -->
    <header class="fixed w-full top-0 glass-header z-50 border-b border-white/50 transition-all duration-300" id="mainHeader">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-center items-center">
            <h1 class="text-3xl font-serif tracking-wide text-brand-dark">Hodaya <span class="text-brand-rose italic text-2xl">Beauty</span></h1>
        </div>
    </header>

    <main class="pt-24 max-w-md mx-auto px-6 space-y-12 relative z-10">
        
        <!-- Hero Section -->
        <div class="scroll-reveal relative rounded-[2rem] overflow-hidden h-[400px] shadow-2xl shadow-brand-rose/10 transform transition-transform hover:scale-[1.02] duration-500">
            <img src="https://images.unsplash.com/photo-1512496015851-a1fb253860bb?auto=format&fit=crop&q=80&w=800" alt="Premium Makeup" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-brand-dark/90 via-brand-dark/20 to-transparent flex flex-col justify-end p-8">
                <div class="w-10 h-1 bg-brand-rose mb-4 rounded-full"></div>
                <h2 class="text-white text-5xl font-serif leading-tight shadow-sm mb-2">האמנות<br><span class="italic font-light text-brand-pink">שביופי שלך</span></h2>
            </div>
        </div>

        <!-- Categories / Services -->
        <div class="scroll-reveal" style="transition-delay: 100ms;">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-2xl font-serif font-bold text-brand-dark">ההתמחויות שלנו</h3>
            </div>
            <div class="flex gap-4 overflow-x-auto hide-scrollbar pb-6 -mx-6 px-6 snap-x">
                
                <div class="snap-center min-w-[150px] glass-panel rounded-[1.5rem] p-6 text-center flex-shrink-0 transform transition active:scale-95">
                    <div class="w-16 h-16 mx-auto bg-gradient-to-br from-brand-pink to-rose-100 rounded-2xl flex items-center justify-center mb-4 text-3xl shadow-inner rotate-3 transition-transform hover:rotate-12 duration-300">💄</div>
                    <h4 class="font-bold text-brand-dark">איפור ערב</h4>
                </div>
                
                <div class="snap-center min-w-[150px] glass-panel rounded-[1.5rem] p-6 text-center flex-shrink-0 transform transition active:scale-95">
                    <div class="w-16 h-16 mx-auto bg-gradient-to-br from-brand-pink to-rose-100 rounded-2xl flex items-center justify-center mb-4 text-3xl shadow-inner -rotate-3 transition-transform hover:-rotate-12 duration-300">💅</div>
                    <h4 class="font-bold text-brand-dark">מניקור ולק ג'ל</h4>
                </div>
                
                <div class="snap-center min-w-[150px] glass-panel rounded-[1.5rem] p-6 text-center flex-shrink-0 transform transition active:scale-95">
                    <div class="w-16 h-16 mx-auto bg-gradient-to-br from-brand-pink to-rose-100 rounded-2xl flex items-center justify-center mb-4 text-3xl shadow-inner rotate-3 transition-transform hover:rotate-12 duration-300">✨</div>
                    <h4 class="font-bold text-brand-dark">בניית ציפורניים</h4>
                </div>

            </div>
        </div>

        <!-- Portfolio Snippet -->
        <div class="scroll-reveal" style="transition-delay: 200ms;">
            <h3 class="text-2xl font-serif font-bold text-brand-dark mb-6">יצירות אחרונות</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="group relative rounded-[1.5rem] overflow-hidden h-56 shadow-lg">
                    <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?auto=format&fit=crop&q=80&w=500" alt="Makeup Art" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors duration-500"></div>
                </div>
                <div class="group relative rounded-[1.5rem] overflow-hidden h-56 shadow-lg mt-6">
                    <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&q=80&w=500" alt="Nail Art" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors duration-500"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Floating CTA Button -->
    <div class="fixed bottom-8 left-0 right-0 px-6 z-40 max-w-md mx-auto pointer-events-none">
        <button onclick="toggleModal('bookingModal')" class="pointer-events-auto w-full bg-brand-dark text-white rounded-[1.5rem] py-4 px-6 font-bold text-lg shadow-[0_10px_40px_rgba(28,25,23,0.3)] hover:bg-black transition-all duration-300 transform active:scale-95 flex justify-between items-center group">
            <span class="tracking-wide">שרייני תור עכשיו</span>
            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center relative">
                <div class="absolute inset-0 bg-white/20 rounded-full animate-ping opacity-75"></div>
                <svg class="w-5 h-5 text-brand-pink relative z-10 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </div>
        </button>
    </div>

    <!-- Booking Modal (Glassmorphism Sheet) -->
    <div id="bookingModal" class="fixed inset-0 bg-brand-dark/40 z-[100] hidden flex-col justify-end transition-opacity backdrop-blur-md opacity-0 duration-300">
        <div id="modalContent" class="glass-panel w-full max-w-md mx-auto rounded-t-[2.5rem] p-8 transform translate-y-full transition-transform duration-500 relative max-h-[90vh] overflow-y-auto">
            
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-8 cursor-pointer" onclick="toggleModal('bookingModal')"></div>
            
            <div class="text-center mb-8">
                <h3 class="text-3xl font-serif font-bold text-brand-dark">התור החדש שלך</h3>
                <p class="text-sm text-gray-600 mt-2">נשמח לפנק אותך. בחרי שירות ומועד.</p>
            </div>
            
            <form class="space-y-5" onsubmit="event.preventDefault(); alert('הבקשה נשלחה!'); toggleModal('bookingModal');">
                <!-- Inputs styled with minimal borders and glassy feel -->
                <div>
                    <select required class="w-full bg-white/50 backdrop-blur-sm border border-gray-200/50 rounded-2xl py-4 px-5 focus:outline-none focus:border-brand-rose focus:ring-2 focus:ring-brand-rose/20 transition-all font-medium text-gray-700">
                        <option value="">באיזה טיפול תרצי לבחור?</option>
                        <option value="makeup">איפור ערב / כלה</option>
                        <option value="nails">מניקור ולק ג'ל / בנייה</option>
                    </select>
                </div>

                <div>
                    <input type="text" required class="w-full bg-white/50 backdrop-blur-sm border border-gray-200/50 rounded-2xl py-4 px-5 focus:outline-none focus:border-brand-rose focus:ring-2 focus:ring-brand-rose/20 transition-all placeholder-gray-400" placeholder="השם המלא שלך">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" required class="w-full bg-white/50 backdrop-blur-sm border border-gray-200/50 rounded-2xl py-4 px-5 focus:outline-none focus:border-brand-rose focus:ring-2 focus:ring-brand-rose/20 transition-all text-gray-600">
                    <input type="time" required class="w-full bg-white/50 backdrop-blur-sm border border-gray-200/50 rounded-2xl py-4 px-5 focus:outline-none focus:border-brand-rose focus:ring-2 focus:ring-brand-rose/20 transition-all text-gray-600">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-brand-dark to-gray-800 text-white rounded-2xl py-4 mt-6 font-bold text-lg shadow-lg transform active:scale-95 transition-all">
                    אישור וסיום
                </button>
            </form>
        </div>
    </div>

    <script>
        // Intersection Observer for Scroll Animations
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target); // Animate only once
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
        });

        // Advanced Modal Toggle with Animation Logic
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            const content = document.getElementById('modalContent');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
                
                // Trigger animations
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('translate-y-full');
                }, 10);
            } else {
                // Reverse animations before hiding
                modal.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                document.body.style.overflow = 'auto';
                
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300); // Matches transition duration
            }
        }
    </script>
</body>
</html>
