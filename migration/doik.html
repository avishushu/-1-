<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumière | מכון יופי וטיפוח</title>
    
    <!-- PWA Setup -->
    <meta name="theme-color" content="#FDFBF9">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">

    <!-- Tailwind CSS (Advanced Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nude: {
                            50: '#FDFBF9',
                            100: '#F5EFE6',
                            200: '#E8DFD3'
                        },
                        gold: '#C5A880',
                        charcoal: '#333333'
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Eruda Mobile Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        /* Smooth scrolling and minimalist adjustments */
        html { scroll-behavior: smooth; }
        body { background-color: #FDFBF9; color: #333333; }
        .glass-panel {
            background: rgba(253, 251, 249, 0.85);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header / Navigation -->
    <header class="fixed w-full top-0 glass-panel z-50 border-b border-nude-200">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-light tracking-widest">LUMIÈRE</h1>
            <button onclick="toggleModal('bookingModal')" class="bg-gold text-white px-5 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-opacity-90 transition">
                קביעת תור
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="pt-24 pb-12 max-w-md mx-auto px-6">
        <div class="rounded-3xl overflow-hidden relative h-72 shadow-lg mb-10">
            <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="אווירת ספא" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black bg-opacity-30 flex items-end p-6">
                <h2 class="text-white text-3xl font-light">הזמן שלך<br>לזרוח.</h2>
            </div>
        </div>

        <!-- Services Section -->
        <h3 class="text-xl font-medium mb-6">השירותים שלנו</h3>
        <div class="space-y-4">
            <!-- Service Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-nude-100 flex justify-between items-center">
                <div>
                    <h4 class="font-medium text-lg">טיפול פנים קלאסי</h4>
                    <p class="text-sm text-gray-500 mt-1">45 דקות</p>
                </div>
                <button onclick="toggleModal('bookingModal')" class="text-gold border border-gold px-4 py-1.5 rounded-full text-sm">בחר</button>
            </div>
            <!-- Service Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-nude-100 flex justify-between items-center">
                <div>
                    <h4 class="font-medium text-lg">מניקור ועיצוב גבות</h4>
                    <p class="text-sm text-gray-500 mt-1">60 דקות</p>
                </div>
                <button onclick="toggleModal('bookingModal')" class="text-gold border border-gold px-4 py-1.5 rounded-full text-sm">בחר</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-nude-100 py-8 text-center mt-auto">
        <p class="text-sm text-gray-500">© 2026 Lumière Beauty.</p>
        <p class="text-xs text-gray-400 mt-2">לתמיכה טכנית: AnfinityRoot@gmail.com</p>
    </footer>

    <!-- Booking Modal (Hidden by default) -->
    <div id="bookingModal" class="fixed inset-0 bg-charcoal bg-opacity-50 z-[100] hidden flex-col justify-end transition-opacity">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6 transform transition-transform translate-y-0 relative">
            <button onclick="toggleModal('bookingModal')" class="absolute top-4 left-6 text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            <h3 class="text-2xl font-light mb-6 mt-2">פרטי התור</h3>
            
            <form class="space-y-5" onsubmit="event.preventDefault(); alert('התור נשמר בהצלחה במסד הנתונים!'); toggleModal('bookingModal');">
                <!-- Name (Required) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם מלא</label>
                    <input type="text" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold transition-colors bg-transparent" placeholder="הכנס שם מלא">
                </div>
                
                <!-- Phone (Optional) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">טלפון <span class="text-gray-400 text-xs">(אופציונלי)</span></label>
                    <input type="tel" class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold transition-colors bg-transparent" placeholder="050-0000000">
                </div>

                <!-- Date & Time Picker -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">תאריך</label>
                        <input type="date" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold transition-colors bg-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">שעה</label>
                        <input type="time" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold transition-colors bg-transparent">
                    </div>
                </div>

                <button type="submit" class="w-full bg-charcoal text-white rounded-xl py-4 mt-6 font-medium tracking-wide shadow-md hover:bg-black transition">
                    אישור וקביעת תור
                </button>
            </form>
        </div>
    </div>

    <!-- UI Logic -->
    <script>
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }
    </script>
</body>
</html>
