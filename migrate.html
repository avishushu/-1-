<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מיגרציה — Leaderboard</title>
<style>
  body { font-family: monospace; background: #0d1117; color: #e6edf3; padding: 16px; font-size: 13px; }
  h2 { color: #f0f6fc; font-size: 1.1rem; }
  #log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; min-height: 300px; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; }
  button { background: #238636; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 1rem; cursor: pointer; margin-bottom: 16px; width: 100%; }
  button:disabled { background: #3d4450; cursor: not-allowed; }
  .ok   { color: #3fb950; }
  .err  { color: #f85149; }
  .info { color: #79c0ff; }
  .warn { color: #d29922; }
</style>
</head>
<body>
<h2>🔄 מיגרציה — Leaderboard</h2>
<button id="btn" onclick="runMigration()">▶ הרץ מיגרציה</button>
<div id="log">לחץ על הכפתור להתחלה...</div>

<script type="module">
import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, getDoc, setDoc,
         query, where, serverTimestamp }
                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyADVI0SVjJLWedUmfbqBYtlgw1BslfXtMY",
  authDomain: "attendancemda.firebaseapp.com",
  projectId: "attendancemda",
  storageBucket: "attendancemda.firebasestorage.app",
  messagingSenderId: "303165146059",
  appId: "1:303165146059:web:cf698f5837c0ee96702c4e"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── log helper ──────────────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── bucket helpers (זהים לגרסה 44-1) ───────────────────────────────
function getISOWeekString(date) {
  const d = date ? new Date(date) : new Date();
  const thu = new Date(d);
  thu.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
  const jan4 = new Date(thu.getFullYear(), 0, 4);
  const week = 1 + Math.round(((thu - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${thu.getFullYear()}-W${String(week).padStart(2, '0')}`;
}
function getMonthString(date) {
  const d = date ? new Date(date) : new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function getBuckets(date) {
  return {
    allTime: 'allTime',
    monthly: 'monthly_' + getMonthString(date),
    weekly:  'weekly_'  + getISOWeekString(date),
  };
}
function toDate(val) {
  if (!val) return null;
  if (val.toDate) return val.toDate();
  if (typeof val.seconds === 'number') return new Date(val.seconds * 1000);
  return null;
}

// ── המיגרציה ────────────────────────────────────────────────────────
async function migrate() {
  log('🚀 מתחיל מיגרציה...', 'info');

  const groupsSnap = await getDocs(collection(db, 'groups'));
  log(`נמצאו ${groupsSnap.size} קבוצות`, 'info');

  for (const gDoc of groupsSnap.docs) {
    const gid  = gDoc.id;
    const name = gDoc.data().name || gid;
    log(`\n▶ קבוצה: ${name}`, 'info');

    const memberUids = gDoc.data().members || [];
    if (!memberUids.length) { log('  אין חברים — דילוג', 'warn'); continue; }

    // שמות
    const userNames = {};
    for (let i = 0; i < memberUids.length; i += 10) {
      const batch = memberUids.slice(i, i + 10);
      const snaps = await getDocs(query(collection(db, 'users'), where('__name__', 'in', batch)));
      snaps.forEach(d => { userNames[d.id] = d.data().fullName || ''; });
    }

    // שאלות לפי session
    const qSnaps = await getDocs(collection(db, `groups/${gid}/quizQuestions`));
    const bySession = {};
    qSnaps.forEach(d => {
      const sn = d.data().sessionNum;
      if (!bySession[sn]) bySession[sn] = new Set();
      bySession[sn].add(d.id);
    });

    // תשובות לפי user
    const allAnswersByUser = {};
    for (let i = 0; i < memberUids.length; i += 10) {
      const batch = memberUids.slice(i, i + 10);
      const aSnaps = await getDocs(query(collection(db, `groups/${gid}/quizAnswers`), where('uid', 'in', batch)));
      aSnaps.forEach(d => {
        const a = { id: d.id, ...d.data() };
        if (!allAnswersByUser[a.uid]) allAnswersByUser[a.uid] = [];
        allAnswersByUser[a.uid].push(a);
      });
    }

    // בנה leaderboard לכל user
    for (const uid of memberUids) {
      const answers = allAnswersByUser[uid] || [];
      const buckets = {};
      const ensureBucket = k => { if (!buckets[k]) buckets[k] = { practiceCount: 0, examSum: 0, examCount: 0 }; };
      const addP = k => { ensureBucket(k); buckets[k].practiceCount++; };
      const addE = (k, s) => { ensureBucket(k); buckets[k].examSum += s; buckets[k].examCount++; };
      const activeWeeks = new Set();

      // practiceOnly
      answers.filter(a => a.practiceOnly === true).forEach(a => {
        const ts = toDate(a.answeredAt); if (!ts) return;
        const bk = getBuckets(ts);
        addP(bk.allTime); addP(bk.monthly); addP(bk.weekly);
        activeWeeks.add(getISOWeekString(ts));
      });

      // exam / smart attempts מלאים
      for (const [, qIds] of Object.entries(bySession)) {
        const rel = answers.filter(a =>
          a.questionId && qIds.has(a.questionId) &&
          ((a.attemptId || '').endsWith('_exam') || (a.attemptId || '').endsWith('_smart'))
        );
        const byAttempt = {};
        rel.forEach(a => { if (!byAttempt[a.attemptId]) byAttempt[a.attemptId] = []; byAttempt[a.attemptId].push(a); });
        for (const [, att] of Object.entries(byAttempt)) {
          const covered = new Set(att.map(a => a.questionId).filter(id => qIds.has(id)));
          if (covered.size < qIds.size) continue;
          const ts = toDate(att.find(a => a.answeredAt)?.answeredAt); if (!ts) continue;
          const bk = getBuckets(ts);
          addP(bk.allTime); addP(bk.monthly); addP(bk.weekly);
          activeWeeks.add(getISOWeekString(ts));
          const relevant = att.filter(a => qIds.has(a.questionId));
          const correct  = relevant.filter(a => a.correct === true).length;
          const score    = Math.round((correct / relevant.length) * 100);
          addE(bk.allTime, score); addE(bk.monthly, score); addE(bk.weekly, score);
        }
      }

      // smartExamScore records
      answers.filter(a => a.mode === 'smartExamScore' && typeof a.score === 'number').forEach(a => {
        const ts = toDate(a.answeredAt); if (!ts) return;
        const bk = getBuckets(ts);
        addE(bk.allTime, a.score); addE(bk.monthly, a.score); addE(bk.weekly, a.score);
        activeWeeks.add(getISOWeekString(ts));
      });

      // streak
      const sortedWeeks = [...activeWeeks].sort().reverse();
      let streak = sortedWeeks.length > 0 ? 1 : 0;
      for (let i = 1; i < sortedWeeks.length; i++) {
        const prev = new Date();
        prev.setDate(prev.getDate() - 7 * i);
        if (sortedWeeks[i] === getISOWeekString(prev)) streak++; else break;
      }

      const lbDoc = {
        uid,
        name: userNames[uid] || '',
        lastUpdated: serverTimestamp(),
        currentWeeklyStreak: streak,
      };
      if (sortedWeeks[0]) lbDoc.lastPracticeWeek = sortedWeeks[0];
      for (const [k, v] of Object.entries(buckets)) lbDoc[k] = v;

      const ref = doc(db, `groups/${gid}/leaderboard/${uid}`);
      await setDoc(ref, lbDoc, { merge: true });
      log(`  ✓ ${userNames[uid] || uid.substring(0, 8)} | streak:${streak} | buckets:${Object.keys(buckets).length}`, 'ok');
    }
  }

  log('\n✅ המיגרציה הושלמה בהצלחה!', 'ok');
  document.getElementById('btn').disabled = false;
  document.getElementById('btn').textContent = '✅ הושלם';
}

// ── חיבור לAuth ────────────────────────────────────────────────────
window.runMigration = async function() {
  document.getElementById('btn').disabled = true;
  document.getElementById('btn').textContent = 'מריץ...';
  logEl.innerHTML = '';

  const user = auth.currentUser;
  if (user) {
    await migrate();
  } else {
    // בקש אימייל וסיסמה
    const email = prompt('אימייל אדמין:');
    const pass  = prompt('סיסמה:');
    if (!email || !pass) { log('בוטל', 'warn'); document.getElementById('btn').disabled = false; return; }
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      log('✓ התחברת בהצלחה', 'ok');
      await migrate();
    } catch(e) {
      log('✗ שגיאת התחברות: ' + e.message, 'err');
      document.getElementById('btn').disabled = false;
      document.getElementById('btn').textContent = '▶ הרץ מיגרציה';
    }
  }
};
</script>
</body>
</html>
